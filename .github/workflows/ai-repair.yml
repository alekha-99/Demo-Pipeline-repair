# ==========================================================================
# AI Pipeline Repair — GitHub Actions Workflow
# ==========================================================================
# Triggers automatically when the CI workflow fails.
# Analyzes the failure, fixes the code, and opens a PR.
#
# Required secrets:
#   - ANTHROPIC_API_KEY: Anthropic Claude API key
# Notes:
#   - GITHUB_TOKEN is auto-provided by GitHub Actions.
# ===========================================================================

name: AI Pipeline Repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed CI workflow run ID to repair"
        required: true
        type: string
      owner:
        description: "Repository owner override (optional)"
        required: false
        type: string
      repo:
        description: "Repository name override (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ai-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  repair:
    name: Auto-Repair Failed Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && !startsWith(github.event.workflow_run.head_branch, 'ai/fix')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Resolve run context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "repo_owner=${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
            echo "repo_name=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "target_branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "repo_owner=${{ inputs.owner || github.repository_owner }}" >> "$GITHUB_OUTPUT"
            echo "repo_name=${{ inputs.repo || github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "target_branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install repair agent
        run: |
          pip install -r ai-repair/requirements.txt
          npm ci --ignore-scripts || true

      - name: Run AI Repair Agent
        id: repair
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ steps.context.outputs.repo_owner }}
          REPO_NAME: ${{ steps.context.outputs.repo_name }}
          REPAIR_PROVIDER: github
          REPAIR_LOG_LEVEL: INFO
          REPAIR_DIRECT_PUSH: "true"
        run: |
          cd ai-repair
          python -m src.main repair \
            "${{ steps.context.outputs.run_id }}" \
            --owner "$REPO_OWNER" \
            --repo "$REPO_NAME" \
            | tee /tmp/repair-result.json

      - name: Validate repair outcome
        shell: bash
        env:
          DIRECT_PUSH: "true"
        run: |
          echo "repair-result.json:"
          cat /tmp/repair-result.json
          python - <<'PY'
          import json
          import sys
          import os

          with open('/tmp/repair-result.json', 'r', encoding='utf-8') as f:
            result = json.load(f)

          status = str(result.get('status', '')).lower()
          pr_url = str(result.get('pr_url', '')).strip()
          pr_number = result.get('pr_number')
          fixes_applied = int(result.get('fixes_applied', 0) or 0)
          direct_push = os.getenv('DIRECT_PUSH', 'false').strip().lower() in {'1', 'true', 'yes', 'on'}

          if status != 'success':
            print(f"Repair did not succeed. status={status}")
            sys.exit(1)

          if fixes_applied <= 0:
            print('Repair reported success but no fixes were applied.')
            sys.exit(1)

          if direct_push:
            print(f"Direct-push repair applied successfully with {fixes_applied} change(s).")
            sys.exit(0)

          if not pr_url or not pr_number:
            print('Repair succeeded technically but no PR was created. Failing workflow to surface skipped/no-op repairs.')
            sys.exit(1)

          print(f"Repair PR created successfully: #{pr_number} {pr_url}")
          PY

      - name: Trigger CI re-run on repaired branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${{ steps.context.outputs.repo_owner }}/${{ steps.context.outputs.repo_name }}/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"${{ steps.context.outputs.target_branch }}"}'
          echo "Triggered CI workflow_dispatch on branch ${{ steps.context.outputs.target_branch }}"

      - name: Upload repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-result-${{ steps.context.outputs.run_id }}
          path: /tmp/repair-result.json
          retention-days: 30
